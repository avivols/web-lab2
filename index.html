<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title> lab2-web </title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <div id="header">
        <p>Авилова Арина Андреевна</p>
        <p>группа P3230</p>
        <p>вариант 46566</p>
    </div>
    <div id="mainContent">
<canvas id="canvas" width="500" height="500">
    <p>Ваш браузер не поддерживает canvas</p>
</canvas>
    <form id="pointForm">
        <fieldset>
            <legend>Ввод координат:</legend>
            <label>X:</label>
            <div id="xButtons">
                <input type="radio" id="x-4" name="x" value="-4">
                <label for="x-4">-4</label>
                <input type="radio" id="x-3" name="x" value="-3">
                <label for="x-3">-3</label>
                <input type="radio" id="x-2" name="x" value="-2">
                <label for="x-2">-2</label>
                <input type="radio" id="x-1" name="x" value="-1">
                <label for="x-1">-1</label>
                <input type="radio" id="x0" name="x" value="0">
                <label for="x0">0</label>
                <input type="radio" id="x1" name="x" value="1">
                <label for="x1">1</label>
                <input type="radio" id="x2" name="x" value="2">
                <label for="x2">2</label>
                <input type="radio" id="x3" name="x" value="3">
                <label for="x3">3</label>
                <input type="radio" id="x4" name="x" value="4">
                <label for="x4">4</label>
            </div>

            <label for="yValue">Y (-3..5):</label>
            <input type="text" id="yValue" name="y">
            <br>
            <label for="rValue">R (1..4):</label>
            <input type="text" id="rValue" name="r">
            <br>
            <button type="submit">Проверить</button>
        </fieldset>
        <p id="errorMessage"></p>
    </form>
    </div>
    <table id="resultTable">
        <thead>
            <tr>
                <th>X</th>
                <th>Y</th>
                <th>R</th>
                <th>Результат</th>
                <th>Дата и время</th>
            </tr>
        </thead>
        <tbody id="resultBody"></tbody>
    </table>
    <button id="clearHistory">Очистить историю</button>
<script src="script.js"></script>
</body>
</html>
